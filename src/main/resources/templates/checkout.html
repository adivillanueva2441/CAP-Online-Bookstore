<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout</title>
    <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{navbar/webpage_navbar :: navbar}"></div>

<div class="container mt-4">
    <h5>Checkout Details</h5>
    <div class="card-body p-0">
        <table class="table table-striped table-responsive">
            <thead class="table-dark text-center">
            <tr>
                <th>Book</th>
                <th>Price</th>
                <th style="width:140px;">Quantity</th>
                <th>Subtotal</th>
            </tr>
            </thead>

            <tbody id="checkout-items" class="text-center"></tbody>

        </table>
    </div>
    <h4>Total: $<span id="checkout-total"></span></h4>

    <a class="btn btn-danger" th:href="@{/cart}">Cancel</a>

    <a class="btn btn-success" id="checkout-btn">Confirm Order</a>
</div>

<script src="/js/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
