<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Cart</title>
    <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{navbar/webpage_navbar :: navbar}"></div>

<div class="container mt-4">

    <h5 class="mb-4">Shopping Cart</h5>

    <div class="card-body p-0">
        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-dark text-center">
                <tr>
                    <th>Book</th>
                    <th>Price</th>
                    <th style="width:140px;">Quantity</th>
                    <th>Subtotal</th>
                    <th style="width:120px;">Action</th>
                </tr>
                </thead>

                <tbody id="cart-table-body" class="text-center">
                <!-- JS populates rows -->
                </tbody>

            </table>

        </div>
    </div>

    <h4 id="cart-total" class="mt-4 mb-4"></h4>
    <a class="btn btn-primary" th:href="@{/}">Back to Home</a>
    <a id="checkoutBtn" class="btn btn-success" th:href="@{/cart/checkout}">
        Proceed To Checkout
    </a>

</div>

<script src="/js/cart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
