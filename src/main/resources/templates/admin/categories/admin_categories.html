<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>The Garrison Book Store - Manage Categories</title>
    <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{admin/navbar/admin_navbar :: admin-navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 fw-bold">Manage Categories</h4>
        <a th:href="@{/admin/categories/create}" class="btn btn-primary btn-sm">+ Add Category</a>
    </div>

    <div class="card shadow p-4">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="categories-table-body">
            <tr>
                <td colspan="3" class="text-center text-muted py-3">Loading...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-4 d-flex justify-content-center">
        <ul class="pagination" id="categories-pagination"></ul>
    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/pagination.js}"></script>
<script th:src="@{/js/admin/admin_categories.js}"></script>
</body>
</html>
