<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>The Garrison Book Store - Edit Book</title>
    <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{admin/navbar/admin_navbar :: admin-navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 fw-bold">Edit Book</h4>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <div id="error-msg" class="alert alert-danger d-none"></div>
            <div id="success-msg" class="alert alert-success d-none"></div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Title</label>
                <input type="text" id="title" class="form-control" placeholder="Enter book title">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea id="description" class="form-control" rows="4" placeholder="Enter book description"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Price</label>
                <input type="number" id="price" class="form-control" placeholder="Enter price" step="0.01" min="0">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Author</label>
                <select id="author" class="form-select">
                    <option value="">Select an author</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Category</label>
                <select id="category" class="form-select">
                    <option value="">Select a category</option>
                </select>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button id="submit-btn" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/admin/books}" class="btn btn-outline-secondary">Cancel</a>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin_book_edit.js}"></script>
</body>
</html>
