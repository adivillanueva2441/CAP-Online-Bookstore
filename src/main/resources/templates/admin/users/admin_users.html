<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>The Garrison Book Store - Users</title>
    <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{admin/navbar/admin_navbar :: admin-navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 fw-bold">Users</h4>
        <a th:href="@{/admin/users/create}" class="btn btn-primary btn-sm">+ Create User</a>
    </div>

    <div class="card shadow p-4">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Username</th>
                <th>Role</th>
            </tr>
            </thead>
            <tbody id="users-table-body">
            <tr>
                <td colspan="5" class="text-center text-muted py-3">Loading...</td>
            </tr>
            </tbody>
        </table>
    </div>
    <ul id="users-pagination" class="pagination justify-content-center mt-4"></ul>

</div>

<script src="/js/pagination.js"></script>
<script src="/js/admin/admin_users.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
