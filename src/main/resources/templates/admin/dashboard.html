    <title>The Garrison Book Store - Admin Dashboard</title>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <p class="text-muted small mb-1">Total Users</p>
                <h4 class="fw-bold mb-0" id="stat-users">—</h4>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <p class="text-muted small mb-1">Total Books</p>
                <h4 class="fw-bold mb-0" id="stat-books">—</h4>
            </div>
        </div>

    <!-- User List & Book List -->
    <div class="row g-3 mb-4">

        <div class="col-md-6">
            <div class="card shadow p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">User List</h5>
                    <a th:href="@{/admin/users}" class="text-muted small">View all →</a>
                </div>
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                    </tr>
                    </thead>
                    <tbody id="admin-recent-users-body">
                    <tr>
                        <td colspan="3" class="text-center text-muted py-3">Loading...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">Book List</h5>
                    <a th:href="@{/admin/books}" class="text-muted small">View all →</a>
                </div>
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="admin-book-list-body">
                    <tr>
                        <td colspan="3" class="text-center text-muted py-3">Loading...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>


    </div>
