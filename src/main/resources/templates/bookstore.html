<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>The Garrison Book Store</title>
    <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Index Navbar -->
<div th:replace="~{navbar/webpage_navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-center my-4">
        <div class="card shadow p-4" style="max-width: 100%; width: 100%;">
            <h5 class="card-title mb-3 text-center">Search Books</h5>

            <div class="row g-2">

                <div class="col-md-6">
                    <input type="text" id="search-title" class="form-control" placeholder="Search by book title...">
                </div>


                <div class="col-md-4">
                    <select id="category-filter" class="form-select">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button id="search-btn" class="btn btn-primary w-100">Search</button>
                </div>

            </div>
        </div>
    </div>
    <!-- Container to be populated dynamically -->
    <div id="book-list" class="row g-3"></div>
    <div id="pagination" class="d-flex justify-content-center mt-3"></div>
</div>

<!-- External JS -->
<script src="/js/bookstore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
