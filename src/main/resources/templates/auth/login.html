<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{navbar/login_navbar :: navbar}"></div>

<div class="d-flex align-items-center justify-content-center vh-100">
    <div class="login-card bg-white">
        <h2 class="text-center mb-4">Welcome Back</h2>

        <!-- Error Message -->
        <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
            You have been logged out.
        </div>

        <!-- Login Form -->
        <form method="post" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required />
            </div>
            <div class="mb-3 position-relative">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <div class="text-center mt-3">
            <span>Don't have an account?</span>
            <a th:href="@{/register}" class="text-decoration-none fw-semibold">Sign Up</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
