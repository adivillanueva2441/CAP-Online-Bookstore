<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{navbar/login_navbar :: navbar}"></div>

<div class="d-flex align-items-center justify-content-center vh-100">
    <div class="login-card bg-white">
        <h2 class="text-center mb-4">Create Account</h2>

        <!-- Success Message -->
        <div th:if="${successMessage}" class="alert alert-success text-center" th:text="${successMessage}"></div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div th:if="${#fields.hasErrors()}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" th:field="*{firstName}" id="firstName" class="form-control" placeholder="John" required/>
                </div>
                <div class="col">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" th:field="*{lastName}" id="lastName" class="form-control" placeholder="Doe" required/>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="johndoe" required/>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="••••••••" required/>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <div th:if="${successMessage}">
            <script th:inline="javascript">
                /*<![CDATA[*/
                alert([[${successMessage}]]);
                /*]]>*/
            </script>
        </div>
        <div class="text-center mt-3">
            <span>Already have an account?</span>
            <a th:href="@{/login}" class="text-decoration-none fw-semibold">Login</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
