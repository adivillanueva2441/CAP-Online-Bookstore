<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Register</title>
        <link rel="stylesheet" th:href="@{/style/auth_style.css}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
    <!-- Navbar at top -->
    <div th:replace="~{navbar/login_navbar :: navbar}"></div>

    <div class="d-flex align-items-center justify-content-center" style="height: 80vh;">
        <div class="card shadow p-4" style="width: 350px;">
            <h3 class="card-title text-center mb-4">Register</h3>
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name:</label>
                    <input type="text" th:field="*{firstName}" id="firstName" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name:</label>
                    <input type="text" th:field="*{lastName}" id="lastName" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Username:</label>
                    <input type="text" th:field="*{username}" id="username" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" th:field="*{password}" id="password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <div class="text-center mt-3">
                <a th:href="@{/login}" class="btn btn-link">Already have an account? Login</a>
            </div>
        </div>
    </div>
    </body>
</html>
